name: Update DevQuest

on:
  schedule:
    # 07:17 em Fortaleza (UTC-3). GitHub pode atrasar execuções agendadas.
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'profile.config.json'
      - 'package.json'
      - '.github/workflows/update-profile.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'profile.config.json'
      - 'package.json'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: read

concurrency:
  group: devquest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check

  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Atualizar dados e SVGs
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - name: Publicar somente os artefatos gerados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh DevQuest profile [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
